<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d9488">
<title>LoopMove · 分阶段搬迁助手</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#12181c; --muted:#6b7a85; --line:#e6eaee;
  --brand:#0d9488; --brand-d:#0f766e; --brand-l:#e6f5f3;
  --warn:#c2740a; --warn-l:#fdf3e2; --bad:#c2342c; --bad-l:#fdeceb; --ok:#1f8a4c; --ok-l:#e8f6ed;
  --r:16px; --sh:0 1px 2px rgba(16,24,32,.06),0 6px 18px rgba(16,24,32,.06);
  --tab-h:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#20262b;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);font-size:15px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;min-height:100%;
  overflow:hidden;
}
body.assist{font-size:17px}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- phone shell ---------- */
.phone{
  position:relative;width:390px;height:844px;flex:0 0 auto;
  background:var(--bg);border-radius:46px;overflow:hidden;
  box-shadow:0 0 0 11px #14181b,0 0 0 13px #2c3339,0 30px 70px rgba(0,0,0,.55);
  display:flex;flex-direction:column;
}
.statusbar{
  height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13px;font-weight:600;letter-spacing:.3px;color:var(--ink);
  background:transparent;position:relative;z-index:30;pointer-events:none;
}
.statusbar .sig{display:flex;align-items:center;gap:5px;font-size:11px}
.notch{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:112px;height:26px;background:#14181b;border-radius:14px;z-index:31;pointer-events:none;
}
.vp{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.homebar{height:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.homebar i{display:block;width:134px;height:5px;border-radius:3px;background:#14181b;opacity:.85}

/* ---------- app header ---------- */
.hd{
  flex:0 0 auto;padding:2px 16px 10px;background:var(--bg);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.hd.stuck{border-bottom-color:var(--line);background:rgba(244,245,247,.94);backdrop-filter:blur(10px)}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.3px}
.hd .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.iconbtn{
  width:34px;height:34px;border-radius:11px;background:#fff;display:flex;align-items:center;
  justify-content:center;font-size:15px;box-shadow:var(--sh);flex:0 0 auto;
}

/* ---------- pages ---------- */
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 14px 24px;scroll-behavior:smooth}
main::-webkit-scrollbar{width:0}
.page{display:none;animation:pageIn .28s cubic-bezier(.22,.7,.3,1)}
.page.on{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.tabbar{
  flex:0 0 auto;height:var(--tab-h);display:flex;background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:2px;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:#93a1ab;font-size:10.5px;font-weight:600;position:relative;transition:color .18s;
}
.tab .ic{font-size:19px;line-height:1;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.tab.on{color:var(--brand)}
.tab.on .ic{transform:translateY(-2px) scale(1.12)}
.tab .dot{
  position:absolute;top:6px;right:calc(50% - 18px);min-width:15px;height:15px;border-radius:8px;
  background:var(--bad);color:#fff;font-size:9.5px;line-height:15px;font-weight:700;padding:0 3px;text-align:center;
}

/* ---------- generic ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card.tight{padding:12px}
.sec-t{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.6px;margin:18px 2px 8px;text-transform:uppercase}
.sec-t:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:12.5px}
.mono{font-variant-numeric:tabular-nums}
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:2.5px 8px;border-radius:20px;
  font-size:11px;font-weight:700;background:#eef1f4;color:#55636e;white-space:nowrap;
}
.pill.b{background:var(--brand-l);color:var(--brand-d)}
.pill.w{background:var(--warn-l);color:var(--warn)}
.pill.r{background:var(--bad-l);color:var(--bad)}
.pill.g{background:var(--ok-l);color:var(--ok)}
.pill.line{background:#fff;border:1px solid var(--line);color:var(--muted)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;
  border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:15px;
  transition:transform .12s,opacity .18s;box-shadow:0 4px 14px rgba(13,148,136,.28);
}
.btn:active{transform:scale(.975);opacity:.92}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.btn.line{background:transparent;color:var(--brand-d);box-shadow:none;border:1.5px solid var(--brand);}
.btn.sm{padding:9px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.45}
.spacer{height:8px}

/* ---------- onboarding ---------- */
.ob{
  position:absolute;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;
}
.ob.hide{display:none}
.ob-top{flex:0 0 auto;padding:8px 18px 0;display:flex;align-items:center;gap:10px}
.ob-dots{display:flex;gap:5px;flex:1}
.ob-dots i{width:6px;height:6px;border-radius:3px;background:#cfd6dc;transition:all .3s}
.ob-dots i.on{width:20px;background:var(--brand)}
.ob-body{flex:1;min-height:0;overflow-y:auto;padding:6px 20px 10px}
.ob-foot{flex:0 0 auto;padding:10px 18px 16px;display:flex;gap:10px}
.ob-k{font-size:12px;font-weight:800;color:var(--brand);letter-spacing:1px;margin-bottom:6px}
.ob-q{font-size:24px;font-weight:800;line-height:1.32;letter-spacing:-.4px;margin:0 0 6px}
.ob-h{font-size:13.5px;color:var(--muted);margin-bottom:14px}
.opt{
  display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;background:#fff;
  box-shadow:var(--sh);margin-bottom:9px;border:2px solid transparent;transition:.16s;
}
.opt:active{transform:scale(.985)}
.opt.on{border-color:var(--brand);background:var(--brand-l)}
.opt .oi{font-size:22px;width:30px;text-align:center;flex:0 0 auto}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block;font-size:15px;font-weight:700}
.opt .ot span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:9px 14px;border-radius:12px;background:#fff;box-shadow:var(--sh);font-size:14px;font-weight:600;
  border:2px solid transparent;transition:.16s;
}
.chip.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.mini{margin-top:9px;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.mini .bar{flex:1;height:4px;border-radius:2px;background:#e9edf0;overflow:hidden}
.mini .bar i{display:block;height:100%;border-radius:2px;background:var(--brand)}
.ob-gen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:0 30px}
.spin{width:46px;height:46px;border-radius:50%;border:3px solid #dfe5ea;border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ob-gen p{font-size:14px;color:var(--muted);margin:0}

/* ---------- plan: summary ---------- */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sumc{background:#fff;border-radius:14px;padding:11px 12px;box-shadow:var(--sh)}
.sumc b{display:block;font-size:20px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.sumc span{font-size:11px;color:var(--muted);display:block;margin-top:1px}

/* ---------- plan: buckets ---------- */
.bk{
  background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;
  transition:box-shadow .18s,transform .18s;border:2px solid transparent;
}
.bk.hot{border-color:var(--brand);transform:scale(1.012);box-shadow:0 0 0 4px var(--brand-l),var(--sh)}
.bk-h{padding:12px 13px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fbfcfd,#fff)}
.bk-h .bn{font-size:15px;font-weight:800;letter-spacing:-.2px}
.bk-h .bw{font-size:11px;color:var(--muted);margin-top:1px}
.bk-h .cnt{
  margin-left:auto;font-size:12px;font-weight:800;color:var(--brand-d);background:var(--brand-l);
  padding:3px 9px;border-radius:20px;font-variant-numeric:tabular-nums;
}
.bk-b{padding:4px 8px 10px;min-height:52px}
.bk.empty .bk-b{
  border:1.5px dashed #d8dee4;border-radius:12px;margin:0 8px 10px;display:flex;align-items:center;
  justify-content:center;color:#9fabb5;font-size:12px;min-height:52px;
}
.icard{
  display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px;background:#fff;
  transition:background .15s;position:relative;margin-bottom:2px;
}
.icard+.icard{border-top:1px solid #f1f4f6}
.icard .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icard .nm small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:1px}
.icard .cost{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.icard.ghosted{opacity:.35}
.icard.lift{opacity:0}
.grip{
  flex:0 0 auto;width:26px;height:34px;display:flex;align-items:center;justify-content:center;
  color:#c2ccd3;font-size:15px;touch-action:none;cursor:grab;letter-spacing:-2px;
}
.grip:active{cursor:grabbing}
.ovr{position:absolute;top:6px;right:4px;font-size:9px;font-weight:800;color:var(--warn);background:var(--warn-l);padding:1px 5px;border-radius:6px}
#fly{
  position:fixed;z-index:99;pointer-events:none;background:#fff;border-radius:14px;
  box-shadow:0 16px 40px rgba(16,24,32,.28);padding:11px 13px;display:none;align-items:center;gap:10px;
  min-width:210px;
}
#fly.on{display:flex}
#fly .nm{font-size:14px;font-weight:700}

/* ---------- items page ---------- */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;margin:0 -14px;padding-left:14px}
.filters::-webkit-scrollbar{height:0}
.fchip{padding:7px 12px;border-radius:20px;background:#fff;font-size:12.5px;font-weight:600;box-shadow:var(--sh);white-space:nowrap;flex:0 0 auto;border:1.5px solid transparent}
.fchip.on{background:var(--brand);color:#fff}
.irow{display:flex;align-items:center;gap:11px;padding:11px 12px;background:#fff;border-radius:14px;box-shadow:var(--sh);margin-bottom:8px;animation:stagger .32s backwards}
@keyframes stagger{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.irow .av{width:38px;height:38px;border-radius:11px;background:var(--brand-l);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.irow .tt{flex:1;min-width:0}
.irow .tt b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .tt span{font-size:11.5px;color:var(--muted)}
.irow .ar{color:#c2ccd3;font-size:16px;flex:0 0 auto}
.aibox{background:linear-gradient(135deg,#0f766e,#14b8a6);border-radius:var(--r);padding:14px;color:#fff;box-shadow:0 8px 22px rgba(13,148,136,.3)}
.aibox h4{margin:0 0 3px;font-size:14.5px;font-weight:800}
.aibox .am{font-size:11.5px;opacity:.86;margin-bottom:11px}
.aibox .btn{background:#fff;color:var(--brand-d);box-shadow:none}

/* ---------- recover: swipe deck ---------- */
.deck{position:relative;height:446px;margin:4px 0 6px}
.rc{
  position:absolute;inset:0;background:#fff;border-radius:20px;box-shadow:0 8px 26px rgba(16,24,32,.14);
  padding:13px 14px;display:flex;flex-direction:column;will-change:transform;transition:transform .26s cubic-bezier(.22,.7,.3,1),opacity .26s;
  overflow:hidden;
}
.rc.b1{transform:translateY(12px) scale(.955);opacity:.75;z-index:1}
.rc.b2{transform:translateY(22px) scale(.915);opacity:.5;z-index:0}
.rc.top{z-index:3;cursor:grab}
.rc .rh{display:flex;align-items:flex-start;gap:10px}
.rc .rh .rav{width:46px;height:46px;border-radius:14px;background:#f1f4f6;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
.rc .rh b{font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.rc .rh .cond{margin-top:5px}
.rc .net{
  margin:10px 0 8px;padding:11px 13px;border-radius:14px;background:#f7f9fa;text-align:center;
}
.rc .net .lb{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.rc .net .vv{font-size:30px;font-weight:800;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;margin-top:1px}
.rc .net .vv.pos{color:var(--ok)} .rc .net .vv.neg{color:var(--bad)} .rc .net .vv.zero{color:var(--muted)}
.rc .ch{padding:11px 12px;border-radius:14px;background:var(--brand-l);border:1.5px solid #c9e9e4}
.rc .ch .cn{font-size:14px;font-weight:800;color:var(--brand-d);margin-bottom:3px}
.rc .ch .cd{font-size:11.5px;color:#3a5b58;line-height:1.45}
.rc .brk{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.rc .brk .l{display:flex;justify-content:space-between;font-size:11.5px;font-variant-numeric:tabular-nums;line-height:1.45}
.rc .brk .l b{font-weight:700}
.rc .brk .l.tot{border-top:1px solid var(--line);padding-top:5px;margin-top:2px;font-weight:800;font-size:12.5px}
.rc .foot{margin-top:auto;display:flex;gap:9px}
.rc .swh{text-align:center;font-size:11px;color:#a4aeb6;margin-top:7px;display:flex;align-items:center;justify-content:center;gap:6px}
.rc .swh i{font-style:normal;font-size:13px}
.idxbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.idxbar .pg{flex:1;height:5px;border-radius:3px;background:#e3e8ec;overflow:hidden}
.idxbar .pg i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .32s cubic-bezier(.22,.7,.3,1)}
.idxbar .tx{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.donebox{text-align:center;padding:26px 16px}
.donebox .dk{font-size:44px;margin-bottom:8px}
.donebox h3{margin:0 0 5px;font-size:19px;font-weight:800}
.donebox p{margin:0;font-size:13px;color:var(--muted)}

/* ---------- sheet ---------- */
#mask{position:fixed;inset:0;background:rgba(12,20,26,.42);opacity:0;pointer-events:none;transition:opacity .24s;z-index:60}
#mask.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:22px 22px 0 0;
  transform:translateY(102%);transition:transform .32s cubic-bezier(.22,.8,.28,1);
  max-height:82vh;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.18);
}
#sheet.on{transform:none}
.sh-grip{padding:9px 0 4px;display:flex;justify-content:center;flex:0 0 auto;touch-action:none}
.sh-grip i{width:38px;height:4.5px;border-radius:3px;background:#d3dae0;display:block}
.sh-h{flex:0 0 auto;padding:2px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sh-h h3{margin:0;font-size:17px;font-weight:800;flex:1;letter-spacing:-.3px}
.sh-b{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 20px}
.sh-b::-webkit-scrollbar{width:0}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.3px}
.fld input,.fld select{
  width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fbfcfd;
  font-size:14.5px;font-weight:600;outline:none;transition:border-color .18s;
}
.fld input:focus,.fld select:focus{border-color:var(--brand)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#fbfcfd;border-radius:13px;margin-bottom:9px}
.sw .sl b{display:block;font-size:14px;font-weight:700}
.sw .sl span{font-size:11.5px;color:var(--muted)}
.tg{width:48px;height:28px;border-radius:14px;background:#d5dce2;position:relative;transition:background .22s;flex:0 0 auto}
.tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.34,1.4,.64,1);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--brand)} .tg.on i{transform:translateX(20px)}

/* trace */
.tr{border-left:2px solid var(--line);padding-left:12px;margin-left:4px}
.tr .ti{position:relative;padding-bottom:13px}
.tr .ti:last-child{padding-bottom:0}
.tr .ti:before{content:'';position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:#c8d0d7;border:2px solid #fff}
.tr .ti.hl:before{background:var(--warn)} .tr .ti.bad:before{background:var(--bad)}
.tr .tl{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.tr .tv{font-size:13.5px;font-weight:700;margin-top:2px}
.tr .tv.bad{color:var(--bad)} .tr .tv.warn{color:var(--warn)}
.tr .td{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.tr .tc{
  margin-top:7px;background:#0f1a1f;color:#b8e6df;padding:10px 11px;border-radius:10px;font-size:11.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;line-height:1.6;
}
.src{display:block;font-size:11.5px;color:var(--brand-d);text-decoration:none;padding:7px 0;border-top:1px solid var(--line);line-height:1.45}
.src span{color:var(--muted)}

/* offers list in sheet */
.of{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}
.of.best{border-color:var(--brand);background:var(--brand-l)}
.of.no{opacity:.62}
.of .oh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.of .on{font-size:14px;font-weight:800;line-height:1.3}
.of .sd{font-size:10.5px;color:var(--muted);margin-top:2px}
.of .nv{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto}
.of .nv.pos{color:var(--ok)} .of .nv.neg{color:var(--bad)} .of .nv.zero{color:var(--muted)}
.of .bd{display:flex;flex-wrap:wrap;gap:5px 10px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.of .bd em{font-style:normal;color:var(--ink);font-weight:700}
.of .nt{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}

/* toast */
#toast{
  position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);z-index:70;
  background:#12181c;color:#fff;padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.26s cubic-bezier(.22,.8,.28,1);max-width:300px;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* more page */

.note.r{background:var(--bad-l);color:#8a211b}

body.assist .hd h1{font-size:23px}
#assistbar{

}
body.assist #assistbar{display:flex}

/* print */
#printarea{display:none}
@media print{

  .phone{box-shadow:none;border-radius:0;width:auto;height:auto}
  .statusbar,.notch,.homebar,.tabbar,.hd,#toast,#mask,#sheet,.ob,#fly{display:none!important}

  .card,.bk{box-shadow:none;break-inside:avoid}
}

  #sheet{bottom:0}

}

  estate:'kwutung', movein:'2026-09', household:'couple', origin:'futian', ntrips:3,
  items: CATALOG.map(o=>({...o})),
  unwanted: UNWANTED.map(o=>({...o})),

  recIdx:{},               // itemId -> 当前展示的渠道下标
  tab:'plan', assist:false, buyNew:false, aiUsed:false, obStep:0
};
const HH = [{k:'single',zh:'单人',en:'Single',ico:'🧍'},{k:'couple',zh:'两人（伴侣）',en:'Couple',ico:'👫'},
            {k:'family',zh:'家庭（含儿童）',en:'Family with children',ico:'👨‍👩‍👧'},{k:'elderly',zh:'与长辈同住',en:'With elderly',ico:'👴'}];
const ORIGIN = [{k:'futian',zh:'福田',en:'Futian',ico:'🏙'},{k:'nanshan',zh:'南山',en:'Nanshan',ico:'🌊'},
                {k:'longhua',zh:'龙华',en:'Longhua',ico:'🏭'},{k:'baoan',zh:'宝安',en:"Bao'an",ico:'✈️'},{k:'luohu',zh:'罗湖',en:'Luohu',ico:'🚉'}];
const MOVEIN = (()=>{const a=[];for(let y=2026;y<=2028;y++)for(let m=1;m<=12;m+=3)a.push(y+'-'+String(m).padStart(2,'0'));return a;})();
const NTR = [2,3,4,5];

const $  = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const L  = o => {
  if(o===null||o===undefined) return o;
  if(Array.isArray(o)) return o.map(L);
  if(typeof o==='object'){
    const ks=Object.keys(o);
    if(ks.length===2 && 'zh' in o && 'en' in o) return o[LANG];
    const r={}; for(const k of ks) r[k]=L(o[k]); return r;
  }
  return o;
};
const T_ = new Proxy({}, { get:(_,k)=>L(T[k]) });
const HKD = n => 'HK$' + Math.round(n).toLocaleString('en-US');
const HKDN = n => (n>0?'+':n<0?'−':'') + 'HK$' + Math.abs(Math.round(n)).toLocaleString('en-US');
const RATE = {base:60, vol:900, wt:3};
const CONDF = {good:1, fair:.7, poor:.35, broken:.05, working:.85};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ====================== LAYER 2: RULE ENGINE ====================== */
function transportCost(it){ return Math.round(RATE.base + it.vol*RATE.vol + it.wt*RATE.wt); }

function compliance(it){
  const tr=[];
  if(it.appliance){
    if(!it.plugOk){
      tr.push({k:'warn', detail:{zh:'插头为「'+it.plug+'」，不符合香港本地供应电器要求（220V/50Hz + 合规英标插头）。跨境电器未必可立即安全使用。',
                                 en:'Plug type "'+it.plug+'" does not meet HK requirements (220V/50Hz + compliant plug).'}});
    } else {
      tr.push({k:'ok', detail:{zh:'电压/插头兼容（'+it.volt+'），无需改装。',en:'Voltage/plug compatible ('+it.volt+').'}});
    }
    if(it.regulated && it.side==='sz' && it.unwanted){
      return {level:'blocked', notes:tr.concat([{k:'block', detail:{zh:'属受管制电器设备。香港对废弃受管制电器设备的进出口有管制，个人行李非贸易用途或可豁免，但实际情形须向海关/环保署确认。本系统不提供清关结论。',
        en:'Regulated electrical equipment. HK controls import/export of abandoned regulated e-equipment; personal baggage may be exempt but must be confirmed with Customs/EPD. This system gives no clearance advice.'}}]),
        src:['customs','emsd']};
    }
    return {level: tr.some(t=>t.k==='warn')?'caution':'ok', notes:tr, src:['emsd']};
  }
  return {level:'ok', notes:[{k:'ok',detail:{zh:'非电器类，无电气合规限制。',en:'Non-electrical item; no electrical compliance constraint.'}}], src:[]};
}

function decideMove(it){
  const est=ESTATES[S.estate], fkey=CAT2F[it.cat]||'supermarket', fac=est.f[fkey], cmp=compliance(it), tr=[];
  tr.push({k:'rule', label:{zh:'① 合规检查',en:'1. Compliance'},
    v: cmp.level==='blocked'?{zh:'阻断',en:'Blocked'}:cmp.level==='caution'?{zh:'需注意',en:'Caution'}:{zh:'通过',en:'Pass'},
    hl:cmp.level!=='ok', bad:cmp.level==='blocked', d:cmp.notes.map(n=>n.detail)});
  if(cmp.level==='blocked'){
    return {action:'SZ', trip:'sz', conf:'high', trace:tr, flags:['customs'],
      why:{zh:'受管制电器，不得凭本系统结论跨境运输 —— 转由深圳侧处置。',
           en:'Regulated appliance: must not be shipped on this system\'s advice. Routed to Shenzhen handling.'}};
  }
  const urg=it.urgency, avail=fac.avail, tc=transportCost(it), repl=it.repl;
  tr.push({k:'fact', label:{zh:'② 急迫性',en:'2. Urgency'}, v:T_.urg[urg],
    d:[it.essential?{zh:'标记为不可替代 / 首晚必需。',en:'Marked irreplaceable / night-one essential.'}:{zh:'按使用时间点排序。',en:'Ranked by when it is actually needed.'}]});
  tr.push({k:'fact', label:{zh:'③ 目的地可获得性',en:'3. Local availability'}, v:Math.round(avail*100)+'% · '+T_.fac[fkey], hl:avail<.4,
    d:[{zh:est.zh+'｜'+T_.fac[fkey]+'：'+T_.st[fac.st]+'（'+L(fac.eta)+'）', en:est.en+' — '+T_.fac[fkey]+': '+T_.st[fac.st]+' ('+L(fac.eta)+')'}]});
  tr.push({k:'fact', label:{zh:'④ 跨境运输成本',en:'4. Transport cost'}, v:HKD(tc),
    d:[{zh:'体积 '+it.vol+' m³ × '+RATE.vol+' + 重量 '+it.wt+' kg × '+RATE.wt+' + 基础分摊 '+RATE.base,
        en:'Volume '+it.vol+'m³ × '+RATE.vol+' + weight '+it.wt+'kg × '+RATE.wt+' + base '+RATE.base}]});
  tr.push({k:'fact', label:{zh:'⑤ 香港重置成本',en:'5. Replacement cost in HK'},
    v: repl==null?{zh:'不可替代',en:'Irreplaceable'}:HKD(repl),
    d: repl==null?[{zh:'无法用金钱重置（证件、药品等）。',en:'Cannot be replaced by purchase.'}]:[{zh:'在香港同类购置的估计价格。',en:'Estimated price to buy equivalent in HK.'}]});

  const buyEff = repl==null?null:Math.round(repl*(1+(1-avail)*0.8));
  const pct=Math.round(avail*100), etaTxt=L(fac.eta);
  const tripOf = u => (u==='immediate'||u==='high')?'T1':u==='medium'?'T2':'T3';
  let action, rule, conf='high', why, calc;

  if(repl==null || it.essential){
    action='T1'; rule='essential';
    why={zh:'不可替代或首晚必需 —— 不参与经济比较，直接进第 1 趟。',
         en:'Irreplaceable or night-one essential: excluded from the economic comparison, placed in trip 1.'};
    calc='不可替代 → 不参与经济比较\n→ Trip 1';
  }
  else if(it.appliance && !it.plugOk){
    if(avail>=.35){
      action='BUY'; rule='compliance';
      why={zh:'插头/电压不符合香港要求（'+it.plug+'），不应跨境直接使用。建议抵港后购买合规版本。',
           en:'Plug/voltage does not meet HK requirements ('+it.plug+'). Buy a compliant version after arrival instead of shipping it.'};
      calc='合规检查 = 未通过（'+it.plug+'）\n当地家电零售可获得性 '+pct+'% ≥ 35% → 可购买合规版本\n→ 在香港购买';
    } else {
      action=tripOf(urg); rule='compliance_fallback'; conf='low';
      why={zh:'电器不合规，但'+est.zh+'的'+T_.fac[fkey]+'仅 '+pct+'%（'+etaTxt+'），当地暂买不到 → 只能带走，但必须更换合规插头并经检验后使用。',
           en:'Non-compliant, but '+T_.fac[fkey]+' near '+est.en+' is only '+pct+'% ('+etaTxt+'); buying locally is not yet possible. Take it, but replace the plug and have it checked before use.'};
      calc='合规检查 = 未通过（'+it.plug+'）\n当地'+T_.fac[fkey]+'可获得性 '+pct+'% < 35% → 当地购买暂不可行\n降级：带走 + 强制安全处理\n置信度降为「低」，需人工复核';
    }
  }
  else if(CONSUMABLE[it.cat] && avail>=.5){
    action='BUY'; rule='consumable';
    why={zh:'属日用消耗品，'+est.zh+'本地超市可获得性 '+pct+'% → 抵达后购买即可，不占用跨境运输额度。',
         en:'A consumable; supermarket availability near '+est.en+' is '+pct+'%. Buy on arrival rather than spending cross-border capacity on it.'};
    calc='运输成本 '+HKD(tc)+' vs 物品价值 '+HKD(repl)+'\n本地可获得性 '+pct+'% ≥ 50% → 当地购买';
  }
  else if(tc>repl*0.6 && avail>=.4){
    action='BUY'; rule='bulky_cheap'; conf='medium';
    why={zh:'运输成本 '+HKD(tc)+' 已超过重置价 '+HKD(repl)+' 的 60%，且本地可获得性 '+pct+'% → 当地购买更合理。',
         en:'Transport '+HKD(tc)+' exceeds 60% of replacement ('+HKD(repl)+') and local availability is '+pct+'%: buying locally is better.'};
    calc='运输 '+HKD(tc)+' > 重置价 '+HKD(repl)+' × 0.6 = '+HKD(repl*0.6)+'\n本地可获得性 '+pct+'% ≥ 40%\n→ 在香港购买';
  }
  else {
    action=tripOf(urg); rule='economic';
    conf = (tc>repl*0.45)?'medium':'high';
    why={zh:'运输成本 '+HKD(tc)+' 低于当地重购的实际代价 '+HKD(buyEff)+'（重置价 '+HKD(repl)+' × 本地稀缺系数）→ 带走更划算，按急迫性排入「'+T_.act[action]+'」。',
         en:'Transport '+HKD(tc)+' is below the effective cost of rebuying ('+HKD(buyEff)+' = '+HKD(repl)+' × local scarcity factor): take it, scheduled by urgency.'};
    calc='带走成本 = 运输                '+HKD(tc)+'\n当地重购 = 重置价 '+HKD(repl)+' × (1 + (1 − '+avail.toFixed(2)+') × 0.8) = '+HKD(buyEff)+'\n'+HKD(tc)+' < '+HKD(buyEff)+'  →  带走（'+T_.act[action]+'）';
  }

  const econ = !(rule==='compliance'||rule==='compliance_fallback'||rule==='essential');
  tr.push({k:'calc', label:{zh:'⑥ 两种方案代价',en:'6. Cost of each option'},
    v: econ?HKD(tc)+' vs '+HKD(buyEff):{zh:'不适用 —— 由更高优先级规则决定',en:'n/a — a higher-priority rule decides'},
    d:[ econ?{zh:'带走只需付运费；当地重购要付重置价，并随本地稀缺程度放大。',
              en:'Moving costs only freight; rebuying costs the replacement price, scaled up by local scarcity.'}
            :{zh:'合规与不可替代性优先于经济比较，本条不按成本高低取舍。',
              en:'Compliance and irreplaceability outrank the economic comparison; cost does not decide this item.'}]});
  tr.push({k:'rule', label:{zh:'⑦ 决策规则',en:'7. Decision rule'}, v:L(why), hl:rule!=='compliance_fallback', bad:rule==='compliance_fallback', calc:calc});
  tr.push({k:'fact', label:{zh:'⑧ 置信度',en:'8. Confidence'}, v:T_.conf[conf],
    d:[ conf==='low'
      ? {zh:'存在未解决的合规问题或信息缺口，置信度降为「低」。执行前须人工复核，并向机电工程署或相关机构确认。',
         en:'An unresolved compliance issue or information gap: confidence is low. Review manually and confirm with EMSD or the relevant body before acting.'}
      : (conf==='medium'
        ? {zh:'两个方案代价较接近（运输成本超过重置价 45%），置信度为「中」，建议复核后再决定。',
           en:'The two options are close (transport exceeds 45% of replacement cost): medium confidence, review before deciding.'}
        : {zh:'规则判定明确，且不涉及未解决的合规问题。',
           en:'The rule outcome is clear and no unresolved compliance issue applies.'})]});
  return {action:action, trip:action==='BUY'?'buy':'t'+action[1], conf:conf, trace:tr, why:why, rule:rule,
          flags: cmp.level==='caution'?['emsd']:[], numbers:{tc:tc, repl:repl, buyEff:buyEff, avail:avail}};
}

function buildOffers(it){
  const O=[], spare = it.cond==='working'||it.cond==='good'||it.cond==='fair';
  if(spare && (it.resale||0)>0){
    O.push({id:'sell', name:{zh:'深圳二手转卖（平台自提）',en:'Sell second-hand in Shenzhen'}, side:'sz', ben:'cash', prio:3, feas:'ok',

        : {zh:'跨境运输 '+HKD(tc)+' + 处置费 '+HKD(320)+'。除非物品确有留港必要，否则不划算。',
           en:'Transport '+HKD(tc)+' + disposal '+HKD(320)+'. Rarely worthwhile unless the item must reach HK.'},
      src:['customs','furniture']});
  }
  if(it.cond==='broken'){

  }
  O.forEach(o=>{ o.net = o.v.value + o.v.subsidy - o.v.transport - o.v.handling - o.v.disposal; });
  const viable = O.filter(o=>o.feas!=='no' && !o.locked);
  const best = viable.slice().sort((a,b)=>(b.net-a.net)||((b.prio||0)-(a.prio||0)))[0] || O[0];
  O.forEach(o=>{ o.best = (o===best && o.feas!=='no' && !o.locked); });
  return {offers:O, best:best};
}

/* 计划：override 优先 */
function planOf(it){
  const d=decideMove(it);
  const act = it.override || d.action;
  return {d:d, action:act, overridden: !!it.override && it.override!==d.action};
}
function costOf(it, act){
  const n=decideMove(it).numbers;
  if(act==='BUY') return n.buyEff==null?0:n.buyEff;
  if(act==='T1'||act==='T2'||act==='T3') return n.tc;
  return 0;
}

    el.addEventListener('click', ()=>{ if(!el.dataset.dragged) openTrace(el.dataset.id); });
  });

function countUp(el, to, dur){
  dur = dur||620;
  const from=0, t0=performance.now();
  const fmt = v => to>999 || String(to).indexOf('HK')>=0 ? HKD(v) : Math.round(v);
  const isHKD = el.textContent.indexOf('HK')>=0 || to>999;
  function frame(t){
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent = isHKD ? HKD(from+(to-from)*e) : String(Math.round(from+(to-from)*e));
    if(k<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- 拖拽 ---------- */
let drag=null;
const fly=$('#fly');
function startDrag(card, e, immediate){
  const id=card.dataset.id, from=card.dataset.act;
  const it=S.items.find(x=>x.id===id);
  if(!it) return;
  const r=card.getBoundingClientRect();
  fly.innerHTML='<span class="grip" style="color:#c2ccd3">⋮⋮</span><span class="nm">'+L(it.zh)+'</span>';
  fly.style.width=r.width+'px';
  fly.classList.add('on');
  moveFly(e.clientX, e.clientY);
  card.classList.add('lift');
  drag={card:card, id:id, from:from, it:it, x0:e.clientX, y0:e.clientY, active:true, hot:null};
  document.body.style.userSelect='none';
}
function moveFly(x,y){ fly.style.left=(x-30)+'px'; fly.style.top=(y-24)+'px'; }
function endDrag(e){
  if(!drag) return;
  const d=drag; drag=null;
  fly.classList.remove('on');
  d.card.classList.remove('lift');
  document.body.style.userSelect='';
  $$('.bk.hot').forEach(b=>b.classList.remove('hot'));
  const el=document.elementFromPoint(e.clientX, e.clientY);
  const bk=el && el.closest ? el.closest('[data-bucket]') : null;
  if(!bk || bk.dataset.bucket===d.from){ renderPlan(); return; }
  const to=bk.dataset.bucket;
  const it=d.it;
  // 不可替代物品没有重置价 —— 改为「当地购买」会得出无依据的经济结论，直接拒绝
  if(to==='BUY' && it.repl==null){
    renderPlan();
    toast(LANG==='zh'
      ? '「'+L(it.zh)+'」属不可替代物品，没有重置价可比较 —— 无法改为在香港购买。'
      : '“'+L(it.zh)+'” is irreplaceable with no replacement price to compare — cannot switch to “buy in HK”.');
    return;
  }
  const before=costOf(it,d.from), after=costOf(it,to);
  const delta=after-before;
  const sys=decideMove(it).action;
  if(to===sys){ delete it.override; toast(T_.tReset); }
  else { it.override=to; }
  renderPlan(); renderItems();
  const dtxt = Math.abs(delta)<1 ? T_.tSame : (delta>0? T_.tCost.replace('%v',HKD(delta)) : T_.tSave.replace('%v',HKD(-delta)));
  toast(T_.tMove.replace('%n', L(it.zh)).replace('%a', T_.act[to]).replace('%d', dtxt));
  if(navigator.vibrate) try{navigator.vibrate(18)}catch(err){}
}

  const card=e.target.closest('.icard');

  if(!drag) return;
  if(drag.pending){
    if(Math.abs(e.clientX-drag.x0)>8 || Math.abs(e.clientY-drag.y0)>8){ clearTimeout(drag.timer); drag=null; }
    return;
  }
  if(!drag.active) return;
  e.preventDefault();
  moveFly(e.clientX,e.clientY);
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const bk=el&&el.closest?el.closest('[data-bucket]'):null;
  $$('.bk.hot').forEach(b=>b.classList.remove('hot'));
  if(bk && bk.dataset.bucket!==drag.from) bk.classList.add('hot');
},{passive:false});
document.addEventListener('pointerup', e=>{
  if(!drag) return;
  if(drag.pending){ clearTimeout(drag.timer); drag.card.dataset.dragged=''; setTimeout(()=>{delete drag.card.dataset.dragged;},60); drag=null; return; }

});

function renderRecover(){

  const q=recQueue(), total=S.unwanted.length, done=total-q.length;

function sumDecisions(){
  return S.unwanted.reduce((a,u)=>{
    const d=S.decisions[u.id]; if(!d) return a;
    const o=buildOffers(u).offers.find(x=>x.id===d);
    return a + (o?o.net:0);
  },0);
}
function curOffer(it){
  const {offers,best}=buildOffers(it);
  const viable=offers.filter(o=>o.feas!=='no');
  if(!viable.length) return {o:offers[0], i:0, n:1};
  let i=S.recIdx[it.id]||0;
  // 默认停在推荐渠道
  if(S.recIdx[it.id]===undefined){
    const bi=viable.findIndex(o=>o.best);
    i = bi>=0?bi:0;
    S.recIdx[it.id]=i;
  }
  i=Math.max(0,Math.min(i,viable.length-1));
  return {o:viable[i], i:i, n:viable.length, viable:viable};
}
function recCard(it, rank){
  const c=curOffer(it), o=c.o;
  const cls = rank===0?'top':rank===1?'b1':'b2';
  const netCls = o.net>0?'pos':o.net<0?'neg':'zero';
  const brk=[];
  if(o.v.value) brk.push([LANG==='zh'?'回收价值':'Recovery value', '+'+HKD(o.v.value)]);
  if(o.v.subsidy) brk.push([LANG==='zh'?'购买补贴':'Purchase subsidy', '+'+HKD(o.v.subsidy)]);
  if(o.v.transport) brk.push([LANG==='zh'?'运输费':'Transport', '−'+HKD(o.v.transport)]);
  if(o.v.handling) brk.push([LANG==='zh'?'处理费':'Handling', '−'+HKD(o.v.handling)]);
  if(o.v.disposal) brk.push([LANG==='zh'?'处置费':'Disposal', '−'+HKD(o.v.disposal)]);
  if(!brk.length) brk.push([LANG==='zh'?'无金钱往来':'No money changes hands', '0']);
  return '<div class="rc '+cls+'" data-id="'+it.id+'">'+
    '<div class="rh"><div class="rav">'+(it.ico||'📦')+'</div><div style="flex:1">'+
      '<b>'+L(it.zh)+'</b>'+
      '<div class="cond"><span class="pill line">'+T_.cond[it.cond]+'</span> <span class="pill line">'+T_.cat[it.cat]+'</span>'+
      (it.appliance?' <span class="pill '+(it.regulated?'r':'w')+'">'+(it.regulated?(LANG==='zh'?'受管制':'Regulated'):(LANG==='zh'?'电器':'Appliance'))+'</span>':'')+'</div>'+
    '</div></div>'+
    '<div class="net"><div class="lb">'+T_.rNet+'</div><div class="vv '+netCls+'">'+HKDN(o.net)+'</div>'+
      '<div style="margin-top:5px"><span class="pill '+(o.ben==='cash'?'g':o.ben==='subsidy'?'w':o.ben==='free'?'b':o.ben==='fee'?'r':'line')+'">'+T_.ben[o.ben]+'</span></div></div>'+
    '<div class="ch"><div class="cn">'+L(o.name)+' <span style="font-weight:600;font-size:11px;color:#3a5b58">('+(c.i+1)+'/'+c.n+')</span></div>'+
      '<div class="cd">'+L(o.note)+'</div></div>'+
    '<div class="brk">'+brk.map(b=>'<div class="l"><span>'+b[0]+'</span><b>'+b[1]+'</b></div>').join('')+
      '<div class="l tot"><span>'+T_.rNet+'</span><b>'+HKDN(o.net)+'</b></div></div>'+
    (rank===0?('<div class="swh"><i>←</i> '+T_.rSwipe+' <i>→</i></div>'):'')+
    '</div>';
}
function bindRec(top){
  const card=$('#deck .rc.top'); if(!card) return;
  card.querySelectorAll('[data-act]').forEach(b=>{
    b.addEventListener('click', ev=>{ ev.stopPropagation(); b.dataset.act==='accept'?acceptTop():skipTop(); });
  });
  // 点卡片 → 全部渠道
  card.addEventListener('click', ()=>{ if(Math.abs(card._dx||0)<6) openOffers(top.id); });
  // 滑动切换渠道
  let sx=0, sy=0, moving=false;
  card.addEventListener('pointerdown', e=>{
    if(e.target.closest('[data-act]')) return;
    sx=e.clientX; sy=e.clientY; moving=true; card._dx=0;
    card.style.transition='none'; card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', e=>{
    if(!moving) return;
    const dx=e.clientX-sx;
    if(Math.abs(e.clientY-sy)>Math.abs(dx)&&Math.abs(e.clientY-sy)>24){ moving=false; card.style.transition=''; card.style.transform=''; return; }
    card._dx=dx;
    card.style.transform='translateX('+(dx*.55)+'px) rotate('+(dx*.022)+'deg)';
  });
  card.addEventListener('pointerup', e=>{
    if(!moving) return; moving=false;
    card.style.transition='';
    const dx=e.clientX-sx; card.style.transform='';
    if(Math.abs(dx)<64) return;
    const it=S.unwanted.find(x=>x.id===top.id);
    const c=curOffer(it), n=c.n;
    let i=c.i + (dx<0?1:-1);
    i=(i+n)%n;
    S.recIdx[it.id]=i;
    const nc=curOffer(it);
    card.style.transition='none';
    card.style.transform='translateX('+(dx<0?-40:40)+'px)';
    card.style.opacity='0';
    setTimeout(()=>{
      card.outerHTML=recCard(it,0);
      const ncard=$('#deck .rc.top');
      if(ncard){ ncard.style.transform='translateX('+(dx<0?40:-40)+'px)'; ncard.style.opacity='0'; requestAnimationFrame(()=>{ ncard.style.transition=''; ncard.style.transform=''; ncard.style.opacity=''; }); }
      bindRec(S.unwanted.find(x=>x.id===top.id));
      if(navigator.vibrate) try{navigator.vibrate(10)}catch(err){}
    },120);
  });
}

  let box=$('#decidedBox');
  if(box) box.remove();
  if(!done.length) return;
  const div=document.createElement('div');
  div.className='card'; div.id='decidedBox';
  div.innerHTML='<div style="font-size:14px;font-weight:800;margin-bottom:8px">'+(LANG==='zh'?'已决定的处置方式':'Decided routes')+'</div>'+
    done.map(u=>{
      const o=buildOffers(u).offers.find(x=>x.id===S.decisions[u.id]);
      const nm=o?L(o.name):(LANG==='zh'?'稍后决定':'Decide later');
      const nt=o?HKDN(o.net):'—';
      return '<div class="between" style="padding:6px 0;border-top:1px solid var(--line)">'+
        '<div style="min-width:0"><div style="font-size:13px;font-weight:700">'+L(u.zh)+'</div>'+
        '<div class="muted">'+nm+'</div></div>'+
        '<span class="mono" style="font-weight:800;font-size:13px">'+nt+'</span></div>';
    }).join('');
  const deck=$('#deck'); deck.parentNode.insertBefore(div, deck.nextSibling);
}

/* ---------- more page ---------- */
function renderMore(){
  const e=ESTATES[S.estate];
  $('#lDest').textContent=T_.mFac;
  $('#mfac').innerHTML=
    '<div class="between" style="margin-bottom:8px"><div><div style="font-size:15.5px;font-weight:800">'+e.zh+'</div>'+
    '<div class="muted">'+e.en+'</div></div><span class="pill b">'+S.movein+'</span></div>'+
    '<div class="muted" style="margin-bottom:10px;line-height:1.55">'+L(e.note)+'</div>'+
    Object.keys(e.f).map(k=>{
      const f=e.f[k], col = f.st==='op'?'#1f8a4c':f.st==='pl'?'#c2740a':'#c2342c';
      return '<div class="fac"><span class="fn">'+T_.fac[k]+'</span>'+
        '<span class="fb"><i style="width:'+Math.round(f.avail*100)+'%;background:'+col+'"></i></span>'+
        '<span class="pill '+(f.st==='op'?'g':f.st==='pl'?'w':'r')+'" style="flex:0 0 auto">'+T_.st[f.st]+'</span>'+
        '<span class="muted" style="flex:0 0 auto;min-width:64px;text-align:right">'+L(f.eta)+'</span></div>';
    }).join('')+
    '<div class="note b" style="margin-top:10px;margin-bottom:0">'+(LANG==='zh'
      ?'可获得性为依政府文件设定的估计值，不是实测；「计划中」的设施绝不按已运营呈现。'
      :'Availability figures are estimates derived from government documents, not on-site surveys. Planned facilities are never presented as operating.')+'</div>';

  $('#lPref').textContent=T_.mPref;
  $('#mpref').innerHTML=
    '<div class="card"><div class="sw"><div class="sl"><b>'+T_.lang+'</b><span>'+T_.langS+'</span></div>'+
      '<div class="tg'+(LANG==='en'?' on':'')+'" id="tgLang"><i></i></div></div>'+
    '<div class="sw"><div class="sl"><b>'+T_.assist+'</b><span>'+T_.assistS+'</span></div>'+
      '<div class="tg'+(S.assist?' on':'')+'" id="tgAssist"><i></i></div></div>'+
    '<div class="sw" style="margin-bottom:0"><div class="sl"><b>'+T_.buyNew+'</b><span>'+T_.buyNewS+'</span></div>'+
      '<div class="tg'+(S.buyNew?' on':'')+'" id="tgBuy"><i></i></div></div></div>';
  $('#tgLang').onclick=function(){ LANG = LANG==='zh'?'en':'zh'; this.classList.toggle('on'); $('#btnLang').textContent=LANG==='zh'?'中':'A'; renderAll(); };
  $('#tgAssist').onclick=function(){ S.assist=!S.assist; this.classList.toggle('on'); document.body.classList.toggle('assist',S.assist); };
  $('#tgBuy').onclick=function(){ S.buyNew=!S.buyNew; this.classList.toggle('on'); renderRecover(); };

  $('#lBound').textContent=T_.mBound;
  $('#mbound').innerHTML='<div class="note r" style="margin-bottom:0">'+T_.boundTxt+'</div>';
  $('#lSrc').textContent=T_.mSrc;
  $('#msrc').innerHTML=Object.keys(SRC).map(k=>{const s=SRC[k];
    return '<a class="src" href="'+s.url+'" target="_blank" rel="noopener">'+L(s.zh)+'<br><span>'+T_.lastV+' '+s.v+' · '+s.url.replace(/^https?:\/\//,'')+'</span></a>';
  }).join('');
  $('#btnPrint').textContent=T_.print;
  $('#btnReOb').textContent=T_.reOb;
}

/* ---------- tabs ---------- */
function switchTab(t){
  S.tab=t;
  $$('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  $$('.page').forEach(p=>p.classList.toggle('on', p.id==='p-'+t));
  renderHeader();
  if(t==='plan') renderPlan();
  if(t==='items') renderItems();
  if(t==='rec') renderRecover();
  if(t==='more') renderMore();
  $('#main').scrollTop=0;
}
$$('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
$('#btnMore').addEventListener('click',()=>switchTab('more'));
$('#btnGoRec').addEventListener('click',()=>switchTab('rec'));

/* ---------- language ---------- */
$('#btnLang').addEventListener('click',()=>{ LANG=LANG==='zh'?'en':'zh'; $('#btnLang').textContent=LANG==='zh'?'中':'A'; renderAll(); });

function applyStatic(){
  $$('.tab').forEach(b=>{ const s=b.querySelector('.tl'); if(s) s.textContent=T_.tab[b.dataset.tab]; });
  $('#szcard') && ($('#lSzList').textContent=T_.szList);
}
function renderAll(){
  applyStatic(); renderHeader(); renderPlan(); renderItems(); renderRecover(); renderMore();
}

/* ---------- print ---------- */
$('#btnPrint').addEventListener('click',()=>{
  const e=ESTATES[S.estate];
  let h='<h1>'+(LANG==='zh'?'LoopMove 分阶段搬迁计划':'LoopMove phased move plan')+'</h1>'+
    '<div class="pmeta">'+e.zh+' / '+e.en+' · '+(LANG==='zh'?'入住':'move-in')+' '+S.movein+' · '+
    (LANG==='zh'?'分':'')+S.ntrips+(LANG==='zh'?'趟':' trips')+' · '+(LANG==='zh'?'生成于':'generated')+' '+new Date().toISOString().slice(0,10)+'</div>';
  ['T1','T2','T3','BUY'].forEach(k=>{
    if(k!=='BUY' && parseInt(k[1],10)>S.ntrips) return;
    const list=S.items.filter(i=>planOf(i).action===k);
    if(!list.length) return;
    h+='<h2>'+T_.trip[k==='BUY'?'buy':'t'+k[1]].zh+' — '+list.length+' '+(LANG==='zh'?'件':'items')+'</h2><table><tr><th>'+(LANG==='zh'?'物品':'Item')+'</th><th>'+(LANG==='zh'?'类别':'Category')+'</th><th>'+(LANG==='zh'?'体积':'Vol')+'</th><th>'+(LANG==='zh'?'重量':'Wt')+'</th><th>'+(LANG==='zh'?'成本':'Cost')+'</th></tr>'+
      list.map(i=>'<tr><td>'+L(i.zh)+'</td><td>'+T_.cat[i.cat]+'</td><td>'+i.vol+' m³</td><td>'+i.wt+' kg</td><td>'+HKD(costOf(i,k))+'</td></tr>').join('')+'</table>';
  });
  const done=S.unwanted.filter(u=>S.decisions[u.id]);
  if(done.length){
    h+='<h2>'+(LANG==='zh'?'深圳侧待办':'Shenzhen action list')+'</h2><table><tr><th>'+(LANG==='zh'?'物品':'Item')+'</th><th>'+(LANG==='zh'?'渠道':'Channel')+'</th><th>'+(LANG==='zh'?'净结果':'Net')+'</th></tr>'+
      done.map(u=>{const o=buildOffers(u).offers.find(x=>x.id===S.decisions[u.id]);
        return '<tr><td>'+L(u.zh)+'</td><td>'+(o?L(o.name):'—')+'</td><td>'+(o?HKDN(o.net):'—')+'</td></tr>';}).join('')+'</table>';
  }
  h+='<div class="pmeta" style="margin-top:5mm">'+T_.boundTxt+'</div>';
  $('#printarea').innerHTML=h;
  window.print();
});

/* ---------- clock ---------- */
(function tick(){
  const d=new Date();
  $('#clock').textContent = d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  setTimeout(tick,20000);
})();

/* ---------- boot ---------- */
$('#main').addEventListener('scroll',()=>{
  $('#hd').classList.toggle('stuck', $('#main').scrollTop>4);
});
obRender();
</script>
</body>
</html>
