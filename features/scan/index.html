.btn{font-size:14px;font-weight:600}.btn:hover{filter:brightness(.96)}.examplePreview:hover img{transform:scale(1.015)}.examplePreview img{transition:transform .25s ease-out}.obsRow{width:100%;text-align:left;min-height:64px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;margin:0;padding-inline:0}.obsRow.active{background:var(--wash);border-color:var(--line)}.obsRow b,.sumRow b{font-size:14px}.obsRow span,.sumRow span{font-size:12px}.obsRow .copy span{max-width:32ch}.itemIcon{background:transparent;width:30px;border-radius:0}.accuracy{border:0;background:var(--wash);align-items:center}.accuracy b{display:none}.accuracy span{font-size:12px;margin:0}.photoCanvas{height:auto;aspect-ratio:4/3}.resultHead h1{font-size:22px}.boxLabel{font-size:11px}.box{border-radius:8px}.summaryTotal .big{font-size:28px}.back .ico{transform:none}.sheetBody input{width:100%}.photoRail:has(.photoBtn:only-child){display:none}::selection{background:var(--wash);color:var(--ink)}

<script>
(function(){
  'use strict';
  var L=window.LoopMoveLogic;
  if(!L){ document.body.innerHTML='<main style="padding:24px;color:#b3352c">扫描逻辑未加载，请确认 scan-logic.js 与本页面在同一目录。</main>'; return; }
  var state={session:L.createSession(),view:'items',selectedObservationId:null,screen:'home',files:[],append:false,isExample:false};
  var $=function(s){return document.querySelector(s);};
  var all=function(s){return Array.from(document.querySelectorAll(s));};
  var icon=function(name){return '<svg class="ico"><use href="#i-'+name+'"></use></svg>';};
  var esc=function(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
  var fmt=function(n){return Number(n||0).toFixed(2);};
  function toast(msg){var t=$('#toast');t.textContent=msg;t.style.opacity='1';t.style.transform='none';clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0';t.style.transform='translateY(10px)';},2200);}
  function show(name){state.screen=name;all('.screen').forEach(function(x){x.classList.toggle('on',x.id===name);});if(name==='capture')renderCapture();if(name==='results')renderResults();if(name==='summary')renderSummary();}
  function toggleTheme(){var root=document.documentElement;var next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;all('[data-action="theme"] use').forEach(function(u){u.setAttribute('href',next==='dark'?'#i-sun':'#i-moon');});}
  function readImage(file){return new Promise(function(resolve,reject){var src=URL.createObjectURL(file),img=new Image();img.onload=function(){resolve({file:file,src:src,width:img.naturalWidth,height:img.naturalHeight});};img.onerror=function(){URL.revokeObjectURL(src);reject(new Error('图片无法读取'));};img.src=src;});}
  function sha256(file){if(!window.crypto||!window.crypto.subtle||!file.arrayBuffer)return Promise.resolve(null);return file.arrayBuffer().then(function(buf){return crypto.subtle.digest('SHA-256',buf);}).then(function(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}).catch(function(){return null;});}
  function openExample(){closeSheet();window.createLoopMoveExample(L,{imageSrc:"../../assets/images/example-room.png"}).then(function(session){state.session=session;state.view='items';state.selectedObservationId=null;state.append=false;state.files=[];state.isExample=true;show('results');}).catch(function(){toast('示例暂时打不开，请刷新重试');});}
  function ingest(files){
    var xs=Array.from(files||[]).filter(function(f){return /^image\//.test(f.type);});
    if(!xs.length){toast('请选择图片文件');return;}
    $('#analyzeTitle').textContent='正在整理 '+xs.length+' 张照片';$('#analyzeSub').textContent='结果会按照片分别保留';show('analyze');
    Promise.all(xs.map(function(file,index){return Promise.all([readImage(file),sha256(file)]).then(function(v){return {id:'photo-'+Date.now()+'-'+index,order:index,fileName:file.name,file:file,src:v[0].src,width:v[0].width,height:v[0].height,size:file.size,sha256:v[1]};});})).then(function(photos){
      var combined=state.append&&!state.isExample?state.session.photos.concat(photos):photos;state.isExample=false;state.append=false;state.files=combined;var useLive=!!window.LOOPMOVE_VISION_ENDPOINT;var inspect=useLive?L.inspectPhotosWithRecognizer(combined,L.createWorkBuddyRecognizer({endpoint:window.LOOPMOVE_VISION_ENDPOINT})):Promise.resolve(L.inspectPhotos(combined));inspect.then(function(next){state.session=next;state.view='items';state.selectedObservationId=null;setTimeout(function(){show('results');},240);});
    }).catch(function(e){toast(e.message||'图片读取失败');show('capture');});
  }
  function renderCapture(){
    var n=state.session.photos.length;$('#drop').classList.toggle('has',n>0);if(n){$('#dropPreview').src=state.session.photos[n-1].src;$('#dropBadge').textContent='已添加 '+n+' 张';}else{$('#dropPreview').removeAttribute('src');$('#dropBadge').textContent='';}
    $('#captureHint').textContent=n?'已添加 '+n+' 张 · 可以继续添加或查看结果':'还没有照片 · 建议上传 2–5 张';
    $('#fileList').innerHTML=state.session.photos.map(function(p,i){return '<div class="fileThumb"><img src="'+p.src+'" alt=""><span class="num">'+(i+1)+'</span></div>';}).join('');
  }
  function photoResult(){return L.getPhotoResult(state.session,state.session.activePhotoId);}
  function renderRail(){
    var ps=state.session.photos;$('#photoRail').innerHTML=ps.map(function(p,i){var count=(p.observations||[]).length;return '<button class="photoBtn '+(p.id===state.session.activePhotoId?'active ':'')+(p.status==='unsupported'?'bad':'')+'" data-photo="'+p.id+'"><img src="'+p.src+'" alt="照片 '+(i+1)+'"><span class="idx num">'+(i+1)+'</span><span class="qty num">'+(p.status==='unsupported'?'?':count)+'</span></button>';}).join('');
  }
  function itemIssue(c){if(c.fixed||c.status==='fixed_or_built_in')return {emoji:'⚠️',label:c.fixed?'固定设施':'确认固定方式'};if(c.status!=='ready')return {emoji:'⌛️',label:c.status==='needs_category'?'确认类别与尺寸':'确认尺寸'};return null;}
  function issueBadge(c){var issue=itemIssue(c);return issue?'<span class="issueBadge" role="img" aria-label="'+issue.label+'" title="'+issue.label+'">'+issue.emoji+'</span>':'';}
  function obsRow(obs,active){var c=L.displayForObservation(obs);return '<button class="obsRow '+(active?'active':'')+'" data-obs="'+obs.id+'"><span class="itemIcon '+(c.fixed?'fixed':'')+'">'+icon(c.icon)+'</span><span class="copy"><b>'+esc(c.label)+'</b></span>'+issueBadge(c)+'</button>';}
  function renderBoxes(r){var canvas=$('#photoCanvas');if(!canvas)return;canvas.querySelectorAll('.box').forEach(function(x){x.remove();});(r.observations||[]).forEach(function(o){if(!o.bbox)return;var c=L.displayForObservation(o);var b=document.createElement('button');b.setAttribute('aria-label','查看'+c.label);b.className='box '+(c.fixed||c.fixedCandidate?'fixed ':'')+(state.selectedObservationId===o.id?'active':'');b.dataset.obs=o.id;var p=r.photo,cw=canvas.clientWidth,ch=canvas.clientHeight,scale=Math.min(cw/p.width,ch/p.height),iw=p.width*scale,ih=p.height*scale;b.style.left=((cw-iw)/2+o.bbox.x*iw)+'px';b.style.top=((ch-ih)/2+o.bbox.y*ih)+'px';b.style.width=(o.bbox.w*iw)+'px';b.style.height=(o.bbox.h*ih)+'px';b.innerHTML='<span class="boxLabel '+(o.bbox.y<.15?'below':'')+'">'+esc(c.label)+(itemIssue(c)?' '+itemIssue(c).emoji:'')+'</span>';canvas.appendChild(b);});}
  function renderCurrent(){
    var r=photoResult(),body=$('#resultBody');if(!r)return;
    var p=r.photo;$('#currentLabel').innerHTML='<b>'+esc(p.label||p.fileName)+'</b><span class="num">'+(state.session.photos.indexOf(p)+1)+' / '+state.session.photos.length+' · '+(r.observations||[]).length+' 个可见物品</span>';
    if(p.status==='unsupported'||p.status==='error'){body.innerHTML='<div class="unsupported">'+icon('alert')+'<b>'+(p.status==='error'?'这张照片没能处理完成':'这张照片暂未识别')+'</b>可以重试，或先体验示例房间。<button class="btn secondary" style="margin-top:12px" data-action="example">查看示例</button></div>';return;}
    body.innerHTML='<div class="currentLabel" id="currentLabel"></div><div class="photoCanvas" id="photoCanvas"><img src="'+p.src+'" alt="'+esc(p.fileName)+'"></div>'+(state.view==='regions'?renderRegions(r):renderItems(r));
    $('#currentLabel').innerHTML='<b>'+esc(p.fileName)+'</b><span>'+(r.observations||[]).length+' 件物品</span>';renderBoxes(r);
  }
  function renderItems(r){return '<div class="obsList">'+(r.observations||[]).map(function(o){return obsRow(o,state.selectedObservationId===o.id);}).join('')+'</div>';}
  function renderRegions(r){var groups=r.groups||[];if(!groups.length)return '<div class="empty"><div class="icoWrap">'+icon('box')+'</div><b>这张照片暂时没有画面分组</b><p>可以切换到“按物品”逐件核对。</p></div>';return groups.map(function(g){var os=(r.observations||[]).filter(function(o){return o.groupId===g.id;});return '<div class="region"><div class="regionTitle">'+esc(g.label)+'</div>'+os.map(function(o){return obsRow(o,state.selectedObservationId===o.id);}).join('')+'</div>';}).join('');}
  function renderResults(){
    var ps=state.session.photos;var visible=ps.reduce(function(n,p){return n+(p.observations||[]).length;},0);$('#resultCount').textContent=(state.isExample?'示例房间 · ':ps.length+' 张照片 · ')+visible+' 件物品';renderRail();$('#accuracyText').textContent=state.isExample?'点物品查看详情，试着整理你的搬家清单。':'尺寸为估算值，搬运前记得核对。';all('[data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===state.view);});$('#resultBody').innerHTML='<div class="currentLabel" id="currentLabel"></div><div class="photoCanvas" id="photoCanvas"></div>';renderCurrent();}
  function renderSummary(){var plan=L.buildPackPlan(state.session);$('#summarySub').textContent=(state.isExample?'示例 · ':'')+plan.items.length+' 件可搬物品 · '+fmt(plan.totalVolume)+' m³';var body=$('#summaryBody');var big=plan.bigVolume, total=plan.totalVolume, pct=total?Math.min(100,big/total*100):0;var h='<div class="summaryTotal"><b class="big num">'+fmt(total)+'</b><span class="unit">m³ 总计（含 10% 余量）</span><div class="bar"><i style="width:'+pct+'%"></i></div><p>大件单运 '+fmt(big)+' m³ · 可装箱 '+fmt(plan.smallVolume)+' m³<br>搬运前请核对实际尺寸。</p></div><div class="section">去重后的搬家清单</div><div class="group">';h+=plan.items.map(function(i){var c=L.displayForEntity(i),d=i.dimensionsCm;return '<div class="sumRow"><span class="itemIcon">'+icon(c.icon)+'</span><span class="copy"><b>'+esc(c.label)+'</b><span>'+d.width+'×'+d.depth+'×'+d.height+' cm · '+fmt(i.volumeM3||L.itemVolume(i))+' m³</span></span><span class="tag">'+(L.canPack(i)===true?'可装箱':'单独运输')+'</span></div>';}).join('')||'<div class="empty"><b>没有可搬物品</b></div>';if(plan.needsReview.length){h+='</div><div class="section">需要补充信息 · '+plan.needsReview.length+' 件</div><div class="group">';h+=plan.needsReview.map(function(i){var c=L.displayForEntity(i);return '<div class="sumRow"><span class="itemIcon">'+icon(c.icon)+'</span><span class="copy"><b>'+esc(c.label)+'</b><span>'+esc((itemIssue(c)||{}).label||'需要确认')+'</span></span>'+issueBadge(c)+'</div>';}).join('');}if(plan.fixed.length){h+='</div><div class="section">固定设施 · '+plan.fixed.length+' 件</div><div class="group">';h+=plan.fixed.map(function(i){var c=L.displayForEntity(i);return '<div class="sumRow"><span class="itemIcon fixed">'+icon(c.icon)+'</span><span class="copy"><b>'+esc(c.label)+'</b></span>'+issueBadge(c)+'</div>';}).join('');}h+='</div><div class="section">容器建议</div><div class="group">';Object.keys(plan.containers).forEach(function(id){var c=L.CONTAINERS.find(function(x){return x.id===id;});h+='<div class="sumRow"><span class="itemIcon">'+icon(c.icon)+'</span><span class="copy"><b>'+c.zh+'</b><span>'+c.width+'×'+c.depth+'×'+c.height+' cm · 可用 '+c.volume.toFixed(3)+' m³</span></span><span class="tag num">×'+plan.containers[id]+'</span></div>';});h+='</div><div class="accuracy" style="margin:18px 0 0">'+icon('info')+'<div><b>这份清单来自照片核对</b><span>待确认物品和固定设施未计入。</span></div></div>';body.innerHTML=h;}
  function openSheet(title,html){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;$('#mask').classList.add('on');$('#sheet').classList.add('on');}
  function closeSheet(){$('#mask').classList.remove('on');$('#sheet').classList.remove('on');}
  function openPrecision(){openSheet('清单小提示','<div class="detail"><b>尺寸需核对</b><span>尺寸是估算值，可以在物品详情中修改。体积已预留 10% 搬运空间。</span></div><div class="detail"><b>哪些会计入清单？</b><span>可搬且尺寸完整的物品会计入；固定设施和待确认物品暂不计入。</span></div>'+(state.isExample?'<div class="detail"><b>这是示例房间</b><span>插画和物品结果用于体验，不是你的房间扫描结果。</span></div>':''));}
  function openObservation(id){state.selectedObservationId=id;renderResults();var r=photoResult(),o=(r.observations||[]).find(function(x){return x.id===id;});if(o){var c=L.displayForObservation(o),e=state.session.entities.find(function(x){return x.id===o.entityId;});var issue=itemIssue(c);var html=issue?'<div class="detail"><b>'+issue.emoji+' '+esc(issue.label)+'</b>'+(o.note?'<span>'+esc(o.note)+'</span>':'')+'</div>':'';if(e && c.status!=='ready' && !c.fixed){html+='<div class="detail"><b>这件要搬吗？</b><span>确认后补充尺寸，就能加入清单。</span><div class="row" style="margin-top:10px"><button class="btn secondary" data-disposition="movable" data-entity="'+e.id+'">可搬家具</button><button class="btn secondary" data-disposition="fixed" data-entity="'+e.id+'">固定设施</button></div><button class="btn plain" style="margin-top:8px" data-disposition="dimensions" data-entity="'+e.id+'">我来输入尺寸</button></div>';}else if(c.fixed){html+='<div class="detail"><b>搬家提示</b><span>这是固定设施，默认不会加入搬家清单。</span></div>';}if(e&&c.status==='ready'&&!c.fixed){var d=e.dimensionsCm;html+='<div class="detail"><b>估算尺寸</b><span>'+d.width+' × '+d.depth+' × '+d.height+' cm</span><button class="btn secondary" style="margin-top:12px" data-disposition="dimensions" data-entity="'+e.id+'">修改尺寸</button></div>';}openSheet(c.label||'物品详情',html);}}
  function openDimensions(entityId){openSheet('输入物品尺寸','<div class="detail"><b>尺寸（厘米）</b><span>量一下这件物品，填写实际尺寸。</span><div class="row" style="margin-top:10px"><input id="dimW" inputmode="decimal" type="number" aria-label="宽（厘米）" placeholder="宽" style="min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)"><input id="dimD" inputmode="decimal" type="number" aria-label="深（厘米）" placeholder="深" style="min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)"><input id="dimH" inputmode="decimal" type="number" aria-label="高（厘米）" placeholder="高" style="min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)"></div><button class="btn" style="margin-top:12px" data-action="save-dims" data-entity="'+entityId+'">保存尺寸</button></div>');}
  function save(){var payload=L.exportPayload(state.session);try{localStorage.setItem('loopmove_scan',JSON.stringify(payload));toast('已保存 '+payload.items.length+' 件扫描结果');}catch(e){toast('浏览器未允许保存，请稍后重试');}}
  document.addEventListener('click',function(e){var action=e.target.closest('[data-action]')&&e.target.closest('[data-action]').dataset.action;if(action){if(action==='theme')toggleTheme();else if(action==='example')openExample();else if(action==='camera')$('#cameraInput').click();else if(action==='upload')$('#uploadInput').click();else if(action==='home')show('home');else if(action==='capture')show(state.isExample?'home':'capture');else if(action==='results')show('results');else if(action==='add-more'){state.append=true;show('capture');}else if(action==='precision')openPrecision();else if(action==='close-sheet')closeSheet();else if(action==='inventory')show('summary');else if(action==='save')save();else if(action==='save-dims'){var ent=e.target.dataset.entity;var result=L.setEntityDimensions(state.session,ent,{width:Number($('#dimW').value),depth:Number($('#dimD').value),height:Number($('#dimH').value)});if(!result.ok){toast(result.error);return;}state.session=result.session;closeSheet();renderResults();toast('尺寸已确认');}return;}var disposition=e.target.closest('[data-disposition]');if(disposition){var entId=disposition.dataset.entity;if(disposition.dataset.disposition==='dimensions'){openDimensions(entId);return;}state.session=L.setEntityDisposition(state.session,entId,disposition.dataset.disposition);closeSheet();renderResults();toast(disposition.dataset.disposition==='fixed'?'已标记为固定设施':'已标记为可搬物品');return;}var pb=e.target.closest('[data-photo]');if(pb){state.session=L.selectPhoto(state.session,pb.dataset.photo);state.selectedObservationId=null;renderResults();return;}var vb=e.target.closest('[data-view]');if(vb){state.view=vb.dataset.view;state.session=L.setResultView(state.session,state.view);renderResults();return;}var ob=e.target.closest('[data-obs]');if(ob){openObservation(ob.dataset.obs);return;}var bx=e.target.closest('.box');if(bx){openObservation(bx.dataset.obs);return;}});
  window.addEventListener('resize',function(){if(state.screen==='results')renderBoxes(photoResult());});
  $('#cameraInput').addEventListener('change',function(){ingest(this.files);this.value='';});$('#uploadInput').addEventListener('change',function(){ingest(this.files);this.value='';});
  if(window.LOOPMOVE_VISION_ENDPOINT)$('#homeNote').textContent='拍完整一点，更方便核对。';
  var drop=$('#drop');['dragenter','dragover'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add('hot');});});['dragleave','drop'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove('hot');});});drop.addEventListener('drop',function(e){ingest(e.dataTransfer.files);});window.addEventListener('paste',function(e){var fs=[];Array.from((e.clipboardData&&e.clipboardData.items)||[]).forEach(function(i){if(i.type.indexOf('image/')===0)fs.push(i.getAsFile());});if(fs.length)ingest(fs);});$('#mask').addEventListener('click',closeSheet);
})();
</script>
